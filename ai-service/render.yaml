# Render blueprint for the MyB AI service (free tier).
# Dashboard → New → Blueprint, or point a Web Service at ai-service/ manually.
services:
  - type: web
    name: myb-ai-service
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false # fill in on the dashboard (SETUP.md §7)
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FACE_MATCH_THRESHOLD
        value: "0.35"
      - key: CORS_ORIGINS
        value: "*"
