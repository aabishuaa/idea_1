# Supabase local development config (supabase start / db reset).
# The hosted project is configured through the dashboard; see SETUP.md §1.

project_id = "myb"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["myb://", "exp://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local dev: skip email confirmation round-trips.
enable_confirmations = false

[auth.sms]
# Phone OTP needs a paid SMS provider — email auth for the MVP (SETUP.md §1.3).
enable_signup = false

[storage]
enabled = true
file_size_limit = "10MiB"

[realtime]
enabled = true

[functions.keepwarm]
verify_jwt = false

[functions.extract-intent]
# JWT is verified in-code (requireUser) so local `functions serve` matches prod.
verify_jwt = false

[functions.embed-text]
verify_jwt = false
