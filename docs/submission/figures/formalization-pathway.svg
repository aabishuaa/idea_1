<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740">
  <rect width="1400" height="740" fill="#FFFFFF"/>

  <defs>
    <marker id="j" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9AA6B2"/>
    </marker>
  </defs>

  <text x="60" y="46" font-family="Helvetica, Arial" font-size="26" font-weight="bold" fill="#0F3E85">The progressive pathway — what the worker actually gets at each stage</text>
  <text x="60" y="80" font-family="Helvetica, Arial" font-size="20" fill="#5A6672">Deterministic config, not AI. Two workers in the same trade and parish see an identical pathway, every time.</text>

  <!-- rail -->
  <line x1="205" y1="150" x2="1271" y2="150" stroke="#D6DEE7" stroke-width="6"/>
  <circle cx="205" cy="150" r="20" fill="#1D6FD8"/>
  <circle cx="586" cy="150" r="20" fill="#1D6FD8"/>
  <circle cx="967" cy="150" r="20" fill="#1D6FD8"/>
  <circle cx="1271" cy="150" r="20" fill="#0F8A5F"/>
  <text x="205" y="158" font-family="Helvetica, Arial" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="586" y="158" font-family="Helvetica, Arial" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="967" y="158" font-family="Helvetica, Arial" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="1271" y="158" font-family="Helvetica, Arial" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- Stage 1 -->
  <rect x="60" y="196" width="290" height="300" rx="14" fill="#F4F8FD" stroke="#1D6FD8" stroke-width="2.5"/>
  <text x="84" y="238" font-family="Helvetica, Arial" font-size="24" font-weight="bold" fill="#0F3E85">Get identified</text>
  <text x="84" y="274" font-family="Helvetica, Arial" font-size="18" fill="#31404F">A TRN, and somewhere</text>
  <text x="84" y="298" font-family="Helvetica, Arial" font-size="18" fill="#31404F">separate for work money</text>
  <text x="84" y="322" font-family="Helvetica, Arial" font-size="18" fill="#31404F">to live.</text>
  <line x1="84" y1="346" x2="326" y2="346" stroke="#C6D6EA" stroke-width="2"/>
  <text x="84" y="378" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#0B6B4A">THIS UNLOCKS</text>
  <text x="84" y="408" font-family="Helvetica, Arial" font-size="18" fill="#31404F">Proof of who you are,</text>
  <text x="84" y="432" font-family="Helvetica, Arial" font-size="18" fill="#31404F">and income you can</text>
  <text x="84" y="456" font-family="Helvetica, Arial" font-size="18" fill="#31404F">point at.</text>

  <!-- Stage 2 -->
  <rect x="441" y="196" width="290" height="300" rx="14" fill="#F4F8FD" stroke="#1D6FD8" stroke-width="2.5"/>
  <text x="465" y="238" font-family="Helvetica, Arial" font-size="24" font-weight="bold" fill="#0F3E85">Register the name</text>
  <text x="465" y="274" font-family="Helvetica, Arial" font-size="18" fill="#31404F">Your business name,</text>
  <text x="465" y="298" font-family="Helvetica, Arial" font-size="18" fill="#31404F">filed at the Companies</text>
  <text x="465" y="322" font-family="Helvetica, Arial" font-size="18" fill="#31404F">Office.</text>
  <line x1="465" y1="346" x2="707" y2="346" stroke="#C6D6EA" stroke-width="2"/>
  <text x="465" y="378" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#0B6B4A">THIS UNLOCKS</text>
  <text x="465" y="408" font-family="Helvetica, Arial" font-size="18" fill="#31404F">You can bid for company</text>
  <text x="465" y="432" font-family="Helvetica, Arial" font-size="18" fill="#31404F">and government work,</text>
  <text x="465" y="456" font-family="Helvetica, Arial" font-size="18" fill="#31404F">and open a business</text>
  <text x="465" y="480" font-family="Helvetica, Arial" font-size="18" fill="#31404F">account.</text>

  <!-- Stage 3 -->
  <rect x="822" y="196" width="290" height="300" rx="14" fill="#F4F8FD" stroke="#1D6FD8" stroke-width="2.5"/>
  <text x="846" y="238" font-family="Helvetica, Arial" font-size="24" font-weight="bold" fill="#0F3E85">Operate properly</text>
  <text x="846" y="274" font-family="Helvetica, Arial" font-size="18" fill="#31404F">NIS cover, and records</text>
  <text x="846" y="298" font-family="Helvetica, Arial" font-size="18" fill="#31404F">that hold up to</text>
  <text x="846" y="322" font-family="Helvetica, Arial" font-size="18" fill="#31404F">inspection.</text>
  <line x1="846" y1="346" x2="1088" y2="346" stroke="#C6D6EA" stroke-width="2"/>
  <text x="846" y="378" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#0B6B4A">THIS UNLOCKS</text>
  <text x="846" y="408" font-family="Helvetica, Arial" font-size="18" fill="#31404F">A pension and injury cover</text>
  <text x="846" y="432" font-family="Helvetica, Arial" font-size="18" fill="#31404F">nobody else provides, and a</text>
  <text x="846" y="456" font-family="Helvetica, Arial" font-size="18" fill="#31404F">record lenders accept.</text>

  <!-- Stage 4 -->
  <rect x="1203" y="196" width="137" height="300" rx="14" fill="#EAF7F1" stroke="#0F8A5F" stroke-width="2.5"/>
  <text x="1227" y="238" font-family="Helvetica, Arial" font-size="24" font-weight="bold" fill="#0B6B4A">Grow</text>
  <text x="1227" y="274" font-family="Helvetica, Arial" font-size="18" fill="#31404F">Tax</text>
  <text x="1227" y="298" font-family="Helvetica, Arial" font-size="18" fill="#31404F">compliance,</text>
  <text x="1227" y="322" font-family="Helvetica, Arial" font-size="18" fill="#31404F">and trade</text>
  <text x="1227" y="346" font-family="Helvetica, Arial" font-size="18" fill="#31404F">certification.</text>
  <line x1="1227" y1="366" x2="1316" y2="366" stroke="#A9DCC6" stroke-width="2"/>
  <text x="1227" y="396" font-family="Helvetica, Arial" font-size="17" font-weight="bold" fill="#0B6B4A">UNLOCKS</text>
  <text x="1227" y="426" font-family="Helvetica, Arial" font-size="18" fill="#31404F">Government</text>
  <text x="1227" y="450" font-family="Helvetica, Arial" font-size="18" fill="#31404F">contracts.</text>

  <line x1="360" y1="346" x2="430" y2="346" stroke="#9AA6B2" stroke-width="3" marker-end="url(#j)"/>
  <line x1="741" y1="346" x2="811" y2="346" stroke="#9AA6B2" stroke-width="3" marker-end="url(#j)"/>
  <line x1="1122" y1="346" x2="1192" y2="346" stroke="#9AA6B2" stroke-width="3" marker-end="url(#j)"/>

  <!-- bottom band -->
  <rect x="60" y="530" width="1280" height="176" rx="14" fill="#FFF8E8" stroke="#C98A0B" stroke-width="2.5"/>
  <text x="88" y="572" font-family="Helvetica, Arial" font-size="23" font-weight="bold" fill="#8A5F05">The app never enrols anyone. It earns the right to ask.</text>
  <text x="88" y="610" font-family="Helvetica, Arial" font-size="19" fill="#31404F">A suggestion card appears only when the worker&#39;s own record crosses a threshold — jobs completed, rating held, activity sustained.</text>
  <text x="88" y="640" font-family="Helvetica, Arial" font-size="19" fill="#31404F">It is always suggestion-with-confirm: the worker taps to opt in, and can start the pathway manually at any time from the menu.</text>
  <text x="88" y="676" font-family="Helvetica, Arial" font-size="19" font-style="italic" fill="#5A6672">Costs and working days are shown per step, so a worker knows what registering will actually take before starting.</text>
</svg>
